<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400" fill="none">
  <defs>
    <pattern id="minute-rule" width="24" height="26" patternUnits="userSpaceOnUse">
      <path d="M.5 18V25.5" stroke="#14212B" stroke-opacity=".16"/>
    </pattern>
    <linearGradient id="fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#14212B" stop-opacity="0"/>
      <stop offset=".22" stop-color="#14212B" stop-opacity=".16"/>
      <stop offset=".78" stop-color="#14212B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#14212B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop stop-color="#9F3B08" stop-opacity=".12"/>
      <stop offset="1" stop-color="#9F3B08" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A 24-hour civil-time dial: one dash for every hour. -->
  <g transform="translate(1320 315)">
    <circle r="310" fill="url(#sun-glow)"/>
    <circle r="246" stroke="#14212B" stroke-opacity=".12"/>
    <circle r="278" pathLength="24" stroke="#14212B" stroke-opacity=".24" stroke-width="18" stroke-dasharray=".08 .92"/>
    <circle r="216" pathLength="60" stroke="#14212B" stroke-opacity=".13" stroke-width="9" stroke-dasharray=".045 .955"/>
    <path d="M0-194V0L137 137" stroke="#14212B" stroke-opacity=".18" stroke-width="2"/>
    <circle r="6" fill="#9F3B08" fill-opacity=".46"/>
    <g fill="#14212B" fill-opacity=".34" font-family="DM Mono, monospace" font-size="16" letter-spacing="3">
      <text x="-16" y="-304">00</text>
      <text x="294" y="6">06</text>
      <text x="-16" y="318">12</text>
      <text x="-330" y="6">18</text>
    </g>
    <text x="-63" y="44" fill="#14212B" fill-opacity=".22" font-family="DM Mono, monospace" font-size="12" letter-spacing="4">24 HOURS</text>
  </g>

  <!-- Solar year: an orbit with quarter markers. -->
  <g transform="translate(190 955)">
    <ellipse cx="330" cy="0" rx="430" ry="178" stroke="#14212B" stroke-opacity=".15" stroke-dasharray="5 8"/>
    <ellipse cx="330" cy="0" rx="300" ry="122" stroke="#14212B" stroke-opacity=".08"/>
    <circle cx="-100" r="5" fill="#9F3B08" fill-opacity=".48"/>
    <circle cx="330" cy="-178" r="4" fill="#14212B" fill-opacity=".26"/>
    <circle cx="760" r="4" fill="#14212B" fill-opacity=".26"/>
    <circle cx="330" cy="178" r="4" fill="#14212B" fill-opacity=".26"/>
    <circle cx="330" r="34" fill="#9F3B08" fill-opacity=".09"/>
    <circle cx="330" r="9" fill="#9F3B08" fill-opacity=".34"/>
    <g fill="#14212B" fill-opacity=".3" font-family="DM Mono, monospace" font-size="12" letter-spacing="3">
      <text x="-100" y="-20">0°</text>
      <text x="300" y="-198">90°</text>
      <text x="742" y="-20">180°</text>
      <text x="296" y="210">270°</text>
      <text x="274" y="58">365.2422 DAYS</text>
    </g>
  </g>

  <!-- UTC ruler: sixty fine divisions, anchored at the prime meridian. -->
  <g transform="translate(0 1310)">
    <rect width="1600" height="26" fill="url(#minute-rule)"/>
    <path d="M80 25.5H1520" stroke="url(#fade-x)"/>
    <path d="M800 2V26" stroke="#9F3B08" stroke-opacity=".46" stroke-width="2"/>
    <g fill="#14212B" fill-opacity=".3" font-family="DM Mono, monospace" font-size="11" letter-spacing="2">
      <text x="72" y="2">UTC−12</text>
      <text x="772" y="2">UTC ±00</text>
      <text x="1451" y="2">UTC+12</text>
    </g>
  </g>

  <!-- The equation-of-time analemma, traced faintly like a working diagram. -->
  <g transform="translate(1050 1000) rotate(-10)">
    <path d="M0-174C-74-140-76-66-8-12C54 38 60 108 0 174C-60 108-54 38 8-12C76-66 74-140 0-174Z" stroke="#14212B" stroke-opacity=".12" stroke-width="2"/>
    <path d="M-88 0H88M0-202V202" stroke="#14212B" stroke-opacity=".07"/>
    <circle cy="-174" r="4" fill="#9F3B08" fill-opacity=".38"/>
    <circle cy="174" r="4" fill="#14212B" fill-opacity=".22"/>
    <text x="28" y="-178" fill="#14212B" fill-opacity=".28" font-family="DM Mono, monospace" font-size="11" letter-spacing="3">SOLAR NOON</text>
  </g>
</svg>
